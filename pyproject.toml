[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "experimentacion_mlflow_abandono_clientes"
version = "0.0.1"
description = "Modelo base para predicci\u00f3n de abandono de clientes (Telco Churn): EDA, limpieza y registro en MLflow"
authors = [
  { name = "Gerardo Carre\u00f1o Garcia" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.12.9"


[tool.ruff]
line-length = 99
src = ["experimentacion_mlflow_abandono_clientes"]
include = ["pyproject.toml", "experimentacion_mlflow_abandono_clientes/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["experimentacion_mlflow_abandono_clientes"]
force-sort-within-sections = true

